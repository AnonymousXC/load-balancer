server:
  listen: ":8080"
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

backends:
  - url: "http://localhost:8082"
    weight: 1
  - url: "http://localhost:8083"
    weight: 1
  - url: "http://localhost:8084"
    weight: 2

health:
  interval_seconds: 10
  timeout_seconds: 5
  path: "/health"

rate_limit:
  rps: 100
  burst: 120

strategy: "round_robin"   # round_robin | least_conn | consistent_hash | weighted_random
fasthttp: true